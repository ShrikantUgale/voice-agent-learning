<!doctype html>
<html>
  <body>
    <h1>Pending approvals</h1>
    <div id="list">Nothing pending</div>

    <script>
      async function decide(id, decision) {
        await fetch("/approvals/" + id, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ decision }),
        });
        refresh();
      }

      async function refresh() {
        const items = await (await fetch("/approvals")).json();
        const list = document.getElementById("list");
        list.innerHTML = items.length ? "" : "Nothing pending";

        for (const item of items) {
          const div = document.createElement("div");
          div.style.cssText =
            "border:1px solid #ccc; padding:12px; margin:8px 0";
          div.innerHTML = `
            <b>${item.tool}</b> for user <b>${item.userId}</b><br>
            <pre></pre>
            <button>Approve</button> <button>Reject</button>`;
          div.querySelector("pre").textContent = JSON.stringify(
            item.args,
            null,
            2,
          );
          const [approve, reject] = div.querySelectorAll("button");
          approve.onclick = () => decide(item.id, "approved");
          reject.onclick = () => decide(item.id, "rejected");
          list.appendChild(div);
        }
      }

      refresh();
      setInterval(refresh, 2000); // simple polling, enough for learning
    </script>
  </body>
</html>
